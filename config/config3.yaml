#         ┌───────────┐
#         │b_30       │
#         │           │
#         │     apbm  │
#         └───────┬───┘
#                 │    
#         ┌───────▼───┐
#         │     apbs  │
#         │       ▼   │
#         │b_31 axism │
#         └───────┬───┘
#                 │    
#         ┌───────▼───┐
#         │     axiss │
#         │       ▼   │
#         │b_32  mem  │
#         └───────────┘
---
config:
  prj_dir: <path to avmium project>
  top_dir: <path to the target directory>
  top: apb_axis
  sim_clk_cycles: 28
  wavedump: 1
---
def_mod:                                   
  name: b_30                               
  port:                                    
    name: apbm                            
    proto: apb                            
    dir: master                            
---                                        
def_mod:                                   
  name: b_31                               
  memmap:                                  
    port:                                   
      addr: 0x0                            
      size: 100
      bind: axism
  port:                                    
    name: apbs                            
    proto: apb                            
    dir: slave                             
  port:                                    
    name: axism                            
    proto: axis                           
    dir: master                            
---                                        
def_mod:                                   
  name: b_32                               
  memmap:
    mem:
      addr: 0x0
      size: 100
  port:                                    
    name: axiss                            
    proto: axis                           
    dir: slave                           
---                                        
def_mod:
  name: apb_axis
  if:
    name: apbif
    proto: apb
  if:
    name: axisif
    proto: axis
  mod:
    name: b30
    type: b_30
    conn:
      apbm: apbif
  mod:
    name: b31
    type: b_31
    conn:
      apbs: apbif
      axism: axisif
  mod:
    name: b32
    type: b_32
    conn:
      axiss: axisif
